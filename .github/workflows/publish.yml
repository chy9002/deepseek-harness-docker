name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    # Tags are trusted release refs. Manual runs are permitted only on the
    # repository's default branch, never on an arbitrary feature branch.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Log in to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image tags
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/deepseek-harness
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'manual' }}
        run: |
          set -eu
          docker buildx create --use --name dsh-builder
          docker buildx build --push \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            --tag "${IMAGE}:latest" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --file Dockerfile .
          digest="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "${digest}"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"
      - name: Attest published image
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/deepseek-harness
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
